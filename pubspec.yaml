name: plant_app
description: "잘자라라 - 식물 관리 앱"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  intl: ^0.20.2
  timezone: ^0.11.1
  image_picker: ^1.2.3
  image: ^4.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.34.0 <2.34.6"
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/species_ko.json

  # Pretendard (SIL OFL 1.1) — docs/LICENSE_Pretendard.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
